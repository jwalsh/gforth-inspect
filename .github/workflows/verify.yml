# verify -- the verify baseline (CONTRIBUTING.org) on an Ubuntu runner.
# Not macOS: its minutes cost several times Linux's (owner, 2026-11-23).
# Branch protection on main is to require the check `verify`, which is this
# job's id; it is off until CI is green, and back in 0.4.1 (RELEASING.org,
# "Mainline protection"). The workflow's own name does not matter to that
# rule; renaming the job or giving it a `name:` does, so change RELEASING.org's
# rule set with it.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR supersedes the older run. Pushes to main are never
# cancelled: every commit on main keeps a result.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Experiments name branches and commits by id.
      - name: Fetch every branch
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      # Test the tree under review (pbt/'s default too, named here for the log).
      - name: Select the inspector under test
        run: |
          echo "INSPECT_FS=$GITHUB_WORKSPACE/env/inspect.fs" >> "$GITHUB_ENV"
          echo "SCHEMA_JSON=$GITHUB_WORKSPACE/contract/stacks-log.schema.json" >> "$GITHUB_ENV"
          echo "inspector: this tree's env/inspect.fs"

      # Ubuntu's gforth package is 0.7.3 with all three engines. GNU make is
      # `make` here; the Makefiles and their docs call it gmake.
      - name: Install gforth, GNU make, jq
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gforth make jq
          sudo ln -sf "$(command -v make)" /usr/local/bin/gmake
          for engine in gforth gforth-fast gforth-itc; do
            version=$("$engine" --version 2>&1)
            echo "$engine: $version"
            case "$version" in
              "gforth 0.7.3"*) ;;
              *) echo "::error::$engine is not gforth 0.7.3"; exit 1 ;;
            esac
          done
          gmake --version | head -1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Is there a root gmake verify?
        id: baseline
        run: |
          if [ -f Makefile ] && grep -q '^verify:' Makefile; then
            echo "root=true" >> "$GITHUB_OUTPUT"
          else
            echo "root=false" >> "$GITHUB_OUTPUT"
          fi

      - name: gmake verify
        if: steps.baseline.outputs.root == 'true'
        run: gmake verify

      # The parts of the baseline that exist before the root Makefile lands.
      - name: Privacy scan (calibrate, then scan)
        if: steps.baseline.outputs.root != 'true'
        run: |
          scripts/privacy-scan.sh --calibrate
          scripts/privacy-scan.sh

      - name: Guide check (calibrate, then check)
        if: steps.baseline.outputs.root != 'true'
        run: |
          scripts/check-guides.sh --calibrate
          scripts/check-guides.sh

      - name: Property tests and planted-fault calibration
        if: steps.baseline.outputs.root != 'true'
        run: gmake -C pbt check && gmake -C pbt calibrate
